---
- name: Initialiser le control plane avec kubeadm
  command: >
    kubeadm init
    --pod-network-cidr=192.168.0.0/16
    --control-plane-endpoint="{{ ansible_host }}"
    --upload-certs
  register: kubeadm_init
  creates: /etc/kubernetes/admin.conf

- name: Creer le repertoire .kube pour l'utilisateur courant
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copier l'admin.conf vers le repertoire .kube de l'utilisateur
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Deployer le plugin CNI Calico
  become: false
  command: kubectl --kubeconfig=/home/{{ ansible_user }}/.kube/config apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
  register: calico_deploy
  changed_when: "'created' in calico_deploy.stdout or 'configured' in calico_deploy.stdout"

- name: Generer la commande de raccordement (join) pour les workers
  command: kubeadm token create --print-join-command
  register: kubeadm_join_cmd
  changed_when: false

- name: Stocker la commande join dans une variable globale
  set_fact:
    cacheable: yes
    node_join_command: "{{ kubeadm_join_cmd.stdout }}"
