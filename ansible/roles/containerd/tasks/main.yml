---
- name: Installer les dépendances pour containerd
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Créer le répertoire de keyring pour Docker/Containerd
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Ajouter la clé GPG officielle Docker
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL "https://download.docker.com/linux/{{ kube_os_distro }}/gpg" | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && chmod a+r /etc/apt/keyrings/docker.gpg
    creates: /etc/apt/keyrings/docker.gpg
    executable: /bin/bash

- name: Ajouter le dépôt stable Docker/Containerd
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: |
      deb [arch={{ kube_os_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ kube_os_distro }} {{ ansible_distribution_release }} stable
  notify: Redémarrer containerd

- name: Installer containerd.io
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true

- name: Créer le dossier de configuration containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Déployer la configuration personnalisée containerd (SystemdCgroup = true)
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Redémarrer containerd

- name: S'assurer que containerd est démarré et activé au démarrage
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
