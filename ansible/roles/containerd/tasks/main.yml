---
- name: Installer les dependances pour containerd
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Creer le repertoire de keyring pour Docker/Containerd
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Ajouter la cle GPG officielle Docker
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  creates: /etc/apt/keyrings/docker.gpg

- name: Ajouter le depot stable Docker/Containerd
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

- name: Installer containerd.io
  apt:
    name: containerd.io
    state: present
    update_cache: yes

- name: Creer le dossier de configuration containerd
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Deployer la configuration personnalisee containerd (SystemdCgroup = true)
  template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
  notify: Redemarrer containerd

- name: S'assurer que containerd est demarre et active au demarrage
  systemd:
    name: containerd
    state: started
    enabled: yes
