---
- name: Installer containerd depuis les dépôts système (dnf)
  ansible.builtin.dnf:
    name: containerd
    state: present
  notify: Redémarrer containerd

- name: Créer le dossier de configuration containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Déployer la configuration personnalisée containerd (SystemdCgroup = true)
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Redémarrer containerd

- name: S'assurer que containerd est démarré et activé au démarrage
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
