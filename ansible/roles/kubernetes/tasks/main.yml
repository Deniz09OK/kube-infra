---
- name: Ajouter le dépôt YUM/DNF officiel Kubernetes
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes v{{ kube_version }} repository
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/rpm/"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/rpm/repodata/repomd.xml.key"

- name: Installer kubelet, kubeadm et kubectl via dnf
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: S'assurer que kubelet est activé au démarrage
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
