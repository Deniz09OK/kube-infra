---
- name: Désactiver le swap immédiatement
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: ansible_swaptotal_mb | int > 0
  when: ansible_swaptotal_mb | int > 0

- name: Désactiver le swap de manière persistante dans /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Charger les modules noyau requis pour Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Charger immédiatement les modules noyau
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configurer les paramètres sysctl pour Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Appliquer les paramètres sysctl sans redémarrer
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
