[control_plane]
kube-1 ansible_host=kube-1 ansible_user=ubuntu kube_apiserver_cert_extra_sans=

[workers]
kube-2 ansible_host=kube-2 ansible_user=ubuntu
kube-3 ansible_host=kube-3 ansible_user=ubuntu

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_connection=ssh
kube_version=1.37
kube_os_arch=amd64
kube_os_distro=ubuntu
pod_network_cidr=192.168.0.0/16
calico_manifest_url=https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
containerd_pause_image=registry.k8s.io/pause:3.9
