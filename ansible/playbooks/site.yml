---
- name: Prérequis système pour Kubernetes
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - prerequisites

- name: Installation de containerd et Kubernetes
  hosts: k8s_cluster
  become: true
  gather_facts: false
  roles:
    - containerd
    - kubernetes

- name: Initialisation du control plane
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - control-plane

- name: Rattachement des workers au cluster
  hosts: workers
  become: true
  gather_facts: false
  roles:
    - workers
