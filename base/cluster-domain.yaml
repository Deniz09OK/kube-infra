# Suffixe DNS du cluster (SEC-20) — SOURCE UNIQUE des hostnames exposes par Traefik.
#
# Pas de nom de domaine dedie : sslip.io resout <service>.<IP>.sslip.io vers <IP>.
# IP = Elastic IP de kube-1 (eipalloc-01b09ac3ded352ead), seul noeud qui recoit le trafic
# (Traefik en hostPort 80/443, cf. base/traefik/README.md).
#
# Changement d'IP ou passage a nip.io : modifier UNIQUEMENT `data.suffix` ci-dessous.
# Les Ingress de base/ ecrivent leurs hosts `<service>.CLUSTER_DOMAIN` et la `replacements`
# de base/kustomization.yaml y injecte ce suffixe (convention : docs/hostnames.md).
#
# `local-config` : ce ConfigMap sert seulement au rendu kustomize, il n'est pas deploye.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-domain
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  suffix: 63.188.247.207.sslip.io
