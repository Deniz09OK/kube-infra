apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-domain.yaml
  - argocd/
  - headlamp/
  - traefik/

# Hostnames sslip.io (SEC-20) : remplace le segment `CLUSTER_DOMAIN` de `<service>.CLUSTER_DOMAIN`
# par le suffixe de cluster-domain.yaml, dans tous les Ingress de base/ (charts Helm inclus).
# Les hosts TLS ne sont traites que sur les Ingress annotes cert-manager, les seuls a porter
# un bloc `spec.tls` (kustomize echoue sur un chemin absent). Convention : docs/hostnames.md
replacements:
  - source:
      kind: ConfigMap
      name: cluster-domain
      fieldPath: data.suffix
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.*.host
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Ingress
          annotationSelector: cert-manager.io/cluster-issuer
        fieldPaths:
          - spec.tls.*.hosts.*
        options:
          delimiter: "."
          index: 1
