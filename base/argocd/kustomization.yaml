# Version amont Argo CD : v3.5.6
# Reference distante officielle : https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
# Bootstrap recommande : kubectl apply -k base/argocd --server-side
# (un apply classique peut echouer sur les CRD trop volumineuses, et un premier passage peut necessiter une relance une fois les CRD etablies).
# patch-argocd-cm active `--enable-helm` pour les helmCharts kustomize (SEC-19, Traefik).
# Les patches locaux ajustent les requests/limits (Deployment + StatefulSet) et protegent les CRD contre la suppression (Prune=false) sans secret en clair.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - install.yaml
  - appproject.yaml
  - applications.yaml
patches:
  - path: patch-argocd-cm.yaml
  - path: patch-resources.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "argocd-.*"
  - path: patch-resources.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: "argocd-.*"
  - path: patch-crd-prune.yaml
    target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
