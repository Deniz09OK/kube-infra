apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - protocol: TCP
      port: 80
      name: web
      nodePort: 30080
      targetPort: web
    - protocol: TCP
      port: 443
      name: websecure
      nodePort: 30443
      targetPort: websecure
