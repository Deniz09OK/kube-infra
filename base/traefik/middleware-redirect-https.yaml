# Redirection HTTP -> HTTPS, a activer route par route une fois cert-manager en place :
#   Ingress   : annotation traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
#   IngressRoute : middlewares: [{ name: redirect-https, namespace: traefik }]
# Une redirection globale sur l'entrypoint web est aussi preparee (commentee) dans values.yaml.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/part-of: traefik
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # La CRD Middleware est creee dans la meme synchro : ne pas bloquer le dry-run ArgoCD.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  redirectScheme:
    scheme: https
    permanent: true
