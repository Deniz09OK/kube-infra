# Exposition externe (Ingress/NodePort/OIDC SEC-38 & SEC-64) desactivee tant que l'OIDC n'est pas configure.
# Le Service ClusterIP interne reste disponible pour un acces local via port-forward uniquement.
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
    app.kubernetes.io/version: v0.46.0
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: headlamp
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
  ports:
    - port: 4466
      targetPort: http
      protocol: TCP
      name: http
